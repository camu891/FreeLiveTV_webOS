<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="referrer" content="origin">
	<title>Free Live TV</title>
	<style>
		html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
	</style>
</head>
<body>
	<script>
		(function () {
			var query = window.location.search.replace(/^\?/, "");
			var params = {};
			query.split("&").forEach(function (pair) {
				if (!pair) {
					return;
				}
				var parts = pair.split("=");
				params[decodeURIComponent(parts[0])] = decodeURIComponent((parts[1] || "").replace(/\+/g, " "));
			});
			var path;
			if (params.channel && /^UC[\w-]{22}$/.test(params.channel)) {
				path = "live_stream?channel=" + params.channel + "&";
			} else if (params.v && /^[\w-]{11}$/.test(params.v)) {
				path = params.v + "?";
			} else {
				document.body.style.color = "#fff";
				document.body.appendChild(document.createTextNode("Canal no válido"));
				return;
			}
			var origin = window.location.protocol + "//" + window.location.host;
			var frame = document.createElement("iframe");
			frame.src = "https://www.youtube.com/embed/" + path +
				"autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1" +
				"&origin=" + encodeURIComponent(origin) +
				"&widget_referrer=" + encodeURIComponent(window.location.href.split("?")[0]);
			frame.setAttribute("allow", "autoplay; encrypted-media; fullscreen; picture-in-picture");
			frame.setAttribute("allowfullscreen", "");
			document.body.appendChild(frame);
		})();
	</script>
</body>
</html>
